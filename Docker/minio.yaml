version: '3.8'
services:

  minio:
    image: minio/minio
    hostname: minio
    ports:
      - "127.0.0.1:5000:9000"
    volumes:
      - cron_drive:/data
    networks:
      - cron
    deploy:
      replicas: 1
    command: server /data
    environment:
      - "MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD to a strong secret}"
      - "MINIO_ROOT_USER=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER to a non-default value}"

networks:
  cron:
    external: true


volumes:
  cron_drive:
