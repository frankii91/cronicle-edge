version: '3.8'
services:

# multi manager cluster with minio s3 storage

# start:
# docker stack deploy --compose-file  Docker/LocalCluster.s3.yaml cron_stack_s3

# debug:
# docker stack ps cron_stack_s3 
# docker service logs cron_stack_s3_manager1

# remove
# docker stack rm cron_stack_s3 

  minio:
    image: bitnami/minio
    hostname: minio
    volumes:
      - cron_drive_s3:/data
    networks:
      - cron
    deploy:
      replicas: 1
    user: root
    entrypoint: bash
    command: -c 'mkdir -p /data/cronicle && minio server /data --console-address ":9001"'
    environment:
      - "MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD to a strong secret}"
      - "MINIO_ROOT_USER=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER to a non-default value}"
     
  manager1:
    image: cronicle:bundle
    hostname: manager1
    depends_on:
      - minio
    ports:
      - "3012:3012"
    networks:
      - cron
    deploy:
      replicas: 1
    entrypoint: bash
    command: -c 'curl -I http://minio:9000/minio/health/live && manager'
    environment:
      - "CRONICLE_secret_key=${CRONICLE_SECRET_KEY:?Set CRONICLE_SECRET_KEY to a strong secret}"
      - "CRONICLE_Storage__AWS__endpoint=http://minio:9000"
      - "CRONICLE_Storage__AWS__credentials__accessKeyId=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}"
      - "CRONICLE_Storage__AWS__credentials__secretAccessKey=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}"
    configs:
     - source: cron_s3
       target: /opt/cronicle/conf/storage.json  

  manager2:
    image: cronicle:bundle
    hostname: manager2
    networks:
      - cron
    deploy:
      replicas: 1
    entrypoint: worker
    environment:
      - "CRONICLE_secret_key=${CRONICLE_SECRET_KEY:?Set CRONICLE_SECRET_KEY to a strong secret}"
      - "CRONICLE_Storage__AWS__endpoint=http://minio:9000"
      - "CRONICLE_Storage__AWS__credentials__accessKeyId=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}"
      - "CRONICLE_Storage__AWS__credentials__secretAccessKey=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}"
    configs:
     - source: cron_s3
       target: /opt/cronicle/conf/storage.json

  manager3:
    image: cronicle:bundle
    hostname: manager3
    networks:
      - cron
    deploy:
      replicas: 1
    entrypoint: worker
    environment:
      - "CRONICLE_secret_key=${CRONICLE_SECRET_KEY:?Set CRONICLE_SECRET_KEY to a strong secret}"
      - "CRONICLE_Storage__AWS__endpoint=http://minio:9000"
      - "CRONICLE_Storage__AWS__credentials__accessKeyId=${MINIO_ROOT_USER:?Set MINIO_ROOT_USER}"
      - "CRONICLE_Storage__AWS__credentials__secretAccessKey=${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD}"
    configs:
     - source: cron_s3
       target: /opt/cronicle/conf/storage.json



networks:
  cron:
    driver: overlay
    attachable: true
      
configs:
  cron_s3:
    file: ../sample_conf/examples/storage.s3.json

volumes:
  cron_drive_s3:
