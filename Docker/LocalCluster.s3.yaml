version: '3.8'
services:

# multi manager cluster with minio s3 storage
# Before deploying, create strong, unique secrets:
# printf '%s' 'cronicle-secret' | docker secret create secret_key -
# printf '%s' 'minio-user' | docker secret create minio_root_user -
# printf '%s' 'minio-password' | docker secret create minio_root_password -

# start:
# docker stack deploy --compose-file  Docker/LocalCluster.s3.yaml cron_stack_s3

# debug:
# docker stack ps cron_stack_s3 
# docker service logs cron_stack_s3_manager1

# remove
# docker stack rm cron_stack_s3 

  minio:
    image: bitnami/minio
    hostname: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cron_drive_s3:/data
    networks:
      - cron
    deploy:
      replicas: 1
    user: root
    entrypoint: bash
    command: -c 'export MINIO_ROOT_USER="$$(cat /run/secrets/minio_root_user)" MINIO_ROOT_PASSWORD="$$(cat /run/secrets/minio_root_password)"; mkdir -p /data/cronicle && exec minio server /data --console-address ":9001"'
    secrets:
      - minio_root_user
      - minio_root_password
     
  manager1:
    image: cronicle:bundle
    hostname: manager1
    depends_on:
      - minio
    ports:
      - "3012:3012"
    networks:
      - cron
    deploy:
      replicas: 1
    entrypoint: bash
    command: -c 'export AWS_ACCESS_KEY_ID="$$(cat /run/secrets/minio_root_user)" AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/minio_root_password)"; curl -I http://minio:9000/minio/health/live && exec manager'
    environment:
      - CRONICLE_secret_key_file=/run/secrets/secret_key
    secrets:
      - secret_key
      - minio_root_user
      - minio_root_password
    configs:
     - source: cron_s3
       target: /opt/cronicle/conf/storage.json  

  manager2:
    image: cronicle:bundle
    hostname: manager2
    ports:
      - "3013:3012"
    networks:
      - cron
    deploy:
      replicas: 1
    entrypoint: bash
    command: -c 'export AWS_ACCESS_KEY_ID="$$(cat /run/secrets/minio_root_user)" AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/minio_root_password)"; exec worker'
    environment:
      - CRONICLE_secret_key_file=/run/secrets/secret_key
    secrets:
      - secret_key
      - minio_root_user
      - minio_root_password
    configs:
     - source: cron_s3
       target: /opt/cronicle/conf/storage.json

  manager3:
    image: cronicle:bundle
    hostname: manager3
    ports:
      - "3014:3012"
    networks:
      - cron
    deploy:
      replicas: 1
    entrypoint: bash
    command: -c 'export AWS_ACCESS_KEY_ID="$$(cat /run/secrets/minio_root_user)" AWS_SECRET_ACCESS_KEY="$$(cat /run/secrets/minio_root_password)"; exec worker'
    environment:
      - CRONICLE_secret_key_file=/run/secrets/secret_key
    secrets:
      - secret_key
      - minio_root_user
      - minio_root_password
    configs:
     - source: cron_s3
       target: /opt/cronicle/conf/storage.json



networks:
  cron:
    driver: overlay
    attachable: true
      
configs:
  cron_s3:
    file: ../sample_conf/examples/storage.s3.json

secrets:
  secret_key:
    external: true
  minio_root_user:
    external: true
  minio_root_password:
    external: true

volumes:
  cron_drive_s3:
